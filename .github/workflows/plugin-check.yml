name: Plugin Check

# Plugin Check WordPress.org via WP-CLI. WooCommerce est installé (dépendance
# déclarée Requires Plugins). Gate sur les ERREURS.
#
# Codes ignorés (distribution hors wp.org, comme Facturation / Geo / Connector) :
# - plugin_updater_detected : Update URI volontaire
# - outdated_tested_upto_header : Tested up to relevé après test réel
# - readme_description_non_official_language : readme en français
# - readme_short_description_non_official_language : résumé FR volontaire
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_pc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.2 + WP-CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, zip
          tools: wp-cli
          coverage: none

      - name: Build clean plugin directory
        run: |
          set -euo pipefail
          php tools/build-zip.php
          mkdir -p dist
          unzip -q g2rd-woocommerce-promotions.zip -d dist/

      - name: Install WordPress + WooCommerce
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" >/dev/null 2>&1 && { echo "MySQL prêt."; break; }
            [ "$i" -eq 30 ] && { echo "::error::MySQL indisponible"; exit 1; }
            sleep 2
          done
          wp core download --path=wp --version=latest
          wp config create --path=wp --dbname=wp_pc --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=wp \
            --url=http://example.test --title="Plugin Check" \
            --admin_user=admin --admin_password='AdminPass!2026' \
            --admin_email=admin@example.test --skip-email
          wp plugin install woocommerce --activate --path=wp
          cp -r dist/g2rd-woocommerce-promotions wp/wp-content/plugins/g2rd-woocommerce-promotions

      - name: Install Plugin Check + activate plugin
        run: |
          set -euo pipefail
          wp plugin install plugin-check --activate --path=wp
          wp plugin activate g2rd-woocommerce-promotions --path=wp
          wp --path=wp plugin list

      - name: Run Plugin Check (gate sur les erreurs)
        working-directory: wp
        run: |
          set -uo pipefail

          echo "::group::Rapport Plugin Check complet"
          wp plugin check g2rd-woocommerce-promotions --format=table || true
          echo "::endgroup::"

          set +e
          wp plugin check g2rd-woocommerce-promotions --ignore-warnings --format=json > pc.json 2> pc.err
          CHECK_RC=$?
          set -e
          echo "wp plugin check exit code : ${CHECK_RC}"

          # shellcheck disable=SC2016
          RESULT=$(php -r '
            $ignored = ["plugin_updater_detected", "outdated_tested_upto_header", "readme_description_non_official_language", "readme_short_description_non_official_language"];
            $errors = 0; $ign = 0;
            foreach ((@file("pc.json", FILE_IGNORE_NEW_LINES) ?: []) as $l) {
              $l = trim($l);
              if ($l === "" || $l[0] !== "[") { continue; }
              $arr = json_decode($l, true);
              if (!is_array($arr)) { continue; }
              foreach ($arr as $f) {
                if (($f["type"] ?? "") !== "ERROR") { continue; }
                if (in_array($f["code"] ?? "", $ignored, true)) { $ign++; continue; }
                $errors++;
              }
            }
            echo $errors . " " . $ign;
          ')
          ERRORS=$(echo "$RESULT" | awk '{print $1}')
          IGNORED=$(echo "$RESULT" | awk '{print $2}')
          echo "Erreurs bloquantes : ${ERRORS:-0} | ignorées : ${IGNORED:-0}"

          if [ "${CHECK_RC}" -ne 0 ] && [ "${ERRORS:-0}" -eq 0 ] && [ "${IGNORED:-0}" -eq 0 ] && ! grep -q '^\[' pc.json; then
            echo "::error::wp plugin check a échoué sans findings exploitables."
            cat pc.err || true
            exit 1
          fi

          if [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::error::Plugin Check : ${ERRORS} erreur(s) bloquante(s)."
            exit 1
          fi
          echo "Aucune erreur bloquante Plugin Check."
