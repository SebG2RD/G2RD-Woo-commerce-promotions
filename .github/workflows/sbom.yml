name: SBOM — Inventaire des dépendances

# SBOM CycloneDX attaché à la release. Pas de dépendance PHP runtime : le SBOM
# documente surtout l'outillage / l'absence de vendor prod. Appelé par release.yml.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag de la release cible (ex. v1.0.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release cible (ex. v1.0.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: sbom-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Générer et publier le SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: composer:v2
          coverage: none

      - name: Composer install (prod — aucune dépendance runtime)
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Générer le SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: cyclonedx-json
          output-file: g2rd-woocommerce-promotions-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Uploader le SBOM comme artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.tag }}
          path: g2rd-woocommerce-promotions-sbom.cdx.json
          retention-days: 90

      - name: Attacher le SBOM à la release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" g2rd-woocommerce-promotions-sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
