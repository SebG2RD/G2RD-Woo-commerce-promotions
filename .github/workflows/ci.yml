name: CI

# Tests autonomes + lint outillage + analyse, sur push et PR.
# Adapté de g2rd-facturation / g2rd-wp-job-manager-geo : detect-changes puis
# matrice PHP. Harnais : php tests/run.php (sans PHPUnit). JS : node --check.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Aucun droit par défaut : chaque job déclare les siens.
permissions: {}

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="${PR_BASE_SHA:-}"
            HEAD="${PR_HEAD_SHA:-}"
          else
            BASE="${PUSH_BEFORE_SHA:-}"
            HEAD="$PUSH_SHA"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE="${HEAD}^"
            fi
          fi
          echo "Comparing $BASE..$HEAD"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || printf 'includes/\ntests/\n')"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(includes/|tests/|g2rd-woocommerce-promotions\.php|uninstall\.php|composer\.(json|lock)|phpcs\.xml\.dist|phpcs-security\.xml|phpstan\.neon\.dist|tools/phpstan-bootstrap\.php|\.github/workflows/ci\.yml$)'; then
            echo "php=true" >> "$GITHUB_OUTPUT"
          else
            echo "php=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(assets/admin\.js|composer\.(json|lock)|\.github/workflows/ci\.yml$)'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi

  php:
    name: PHP ${{ matrix.php }}
    needs: detect-changes
    if: needs.detect-changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Requires PHP: 8.1 (en-tête du plugin).
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip
          ini-values: memory_limit=1G, error_reporting=-1, display_errors=On
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies (dev tooling)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntaxe PHP
        run: find g2rd-woocommerce-promotions.php uninstall.php includes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests (harnais autonome)
        run: composer run test

      # Style WordPress : informatif tant que le formatage compact n'est pas
      # normalisé (centaines d'écarts espaces/tabs). La sécurité reste bloquante
      # dans phpcs-security.yml et via composer run lint:security.
      - name: PHPCS (WordPress Coding Standards)
        if: matrix.php == '8.2'
        continue-on-error: true
        run: composer run lint

      - name: PHPCS Security (bloquant)
        if: matrix.php == '8.2'
        run: composer run lint:security

      - name: PHPStan
        if: matrix.php == '8.2'
        run: composer run analyse

      - name: Composer audit
        if: matrix.php == '8.2'
        run: composer audit --locked --abandoned=report

  js:
    name: JS (syntax)
    needs: detect-changes
    if: needs.detect-changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Vérifier assets/admin.js
        run: node --check assets/admin.js
