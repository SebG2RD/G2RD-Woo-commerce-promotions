name: Auto-tag

# Commits « version: x.y.z » → tag vX.Y.Z via PAT (GH_PAT), pour déclencher
# release.yml. Même convention que les autres dépôts G2RD.
#
# Si le tag existe déjà (poussé à la main), le job réussit sans error :
# la release a déjà pu être créée hors de ce workflow.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag from version commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.event.head_commit.message, 'version:')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from commit subject
        id: extract
        run: |
          subject=$(git log -1 --pretty=%s)
          version=$(echo "$subject" | grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$version" ]; then
            echo "::error::Aucune version x.y.z trouvée dans le sujet du commit : $subject"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version alignment across all sources
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: bash tools/verify-release-version.sh "$VERSION"

      - name: Tag déjà présent ou création
        id: tag
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          # Récupère les tags distants (checkout sans credentials).
          git fetch --tags origin 2>/dev/null || true

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::Le tag $TAG existe déjà — rien à faire (release manuelle ou précédente)."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::Secret GH_PAT absent et tag $TAG introuvable."
            echo "Ajoute un PAT (Contents: write) dans Settings → Secrets → Actions → GH_PAT,"
            echo "ou pousse le tag à la main : git tag -a $TAG -m \"Release $TAG\" && git push origin $TAG"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG créé et poussé."
