name: Secrets — gitleaks

# Recherche de secrets commités sur tout l'historique. Binaire officiel
# téléchargé et vérifié par SHA-256 (même approche que g2rd-facturation).
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gitleaks:
    name: gitleaks (historique complet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks 8.30.1 (somme SHA-256 vérifiée)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks version

      - name: Rechercher des secrets (tout l'historique)
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/gitleaks.log"
          rc=0
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --no-color --exit-code 1 \
            --config .github/gitleaks.toml . 2>"$LOG" || rc=$?
          cat "$LOG"
          if grep -q ' ERR ' "$LOG" || ! grep -Eq '(^| )[1-9][0-9]* commits scanned\.' "$LOG"; then
            echo "::error::gitleaks n'a analysé aucun commit ou git a échoué (voir le journal ci-dessus)."
            exit 1
          fi
          exit "$rc"
