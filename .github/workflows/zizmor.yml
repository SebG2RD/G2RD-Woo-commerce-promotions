name: zizmor — Analyse des workflows

# Analyse statique de .github (workflows + dependabot). Même approche que
# g2rd-facturation : pip + empreintes SHA-256, --no-config, --strict-collection.
on:
  push:
    branches: [main, develop]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer zizmor 1.30.1 (empreintes vérifiées)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/zizmor-requirements.txt" <<'EOF'
          zizmor==1.30.1 \
              --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e \
              --hash=sha256:cbb7e5cb2fec471066d5c326bcaa69ed3eefdcf6a76d7ad38335b924acf86c07
          EOF
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes --no-deps --only-binary :all: \
            -r "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --version

      - name: Analyser .github
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --format plain --strict-collection --no-config .github
